<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zone Royale</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0d1117;font-family:system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:#fff;user-select:none}
canvas{display:block;cursor:none}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(20,30,50,.82),rgba(5,8,14,.94));z-index:5}
.hidden{display:none!important}
.panel{background:rgba(22,30,44,.96);border:2px solid #34507a;border-radius:16px;padding:30px 44px 34px;text-align:center;max-width:600px;box-shadow:0 14px 50px rgba(0,0,0,.6)}
h1{margin:0 0 4px;font-size:52px;letter-spacing:3px;background:linear-gradient(180deg,#ffe082,#ff8f00);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:#9fb3d1;margin:0 0 20px;font-size:16px}
table.controls{margin:0 auto 22px;border-collapse:collapse;font-size:15px}
table.controls td{padding:5px 12px;text-align:left}
table.controls td:first-child{text-align:right}
kbd{display:inline-block;min-width:22px;padding:3px 8px;border-radius:6px;background:#2d3f5c;border:1px solid #4a6690;border-bottom-width:3px;font-family:inherit;font-weight:700;font-size:13px;text-align:center}
button{font:inherit;font-size:22px;font-weight:800;letter-spacing:2px;padding:14px 46px;border:0;border-radius:12px;cursor:pointer;color:#1a1200;background:linear-gradient(180deg,#ffd54f,#ff9800);box-shadow:0 5px 0 #b26a00,0 8px 20px rgba(0,0,0,.4)}
button:hover{filter:brightness(1.08)}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #b26a00}
.stats{display:flex;gap:14px;justify-content:center;margin:18px 0 26px}
.stat{background:#1b2638;border:1px solid #34507a;border-radius:10px;padding:10px 18px;min-width:90px}
.stat b{display:block;font-size:28px}
.stat span{font-size:12px;color:#9fb3d1;text-transform:uppercase;letter-spacing:1px}
#endTitle.win{background:linear-gradient(180deg,#fff59d,#ffb300);-webkit-background-clip:text;background-clip:text;color:transparent}
#endTitle.lose{background:linear-gradient(180deg,#ef9a9a,#c62828);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="startScreen" class="overlay">
  <div class="panel">
    <h1>ZONE ROYALE</h1>
    <p class="sub">20 players drop in. The zone closes in. Only one walks out.</p>
    <table class="controls">
      <tr><td><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></td><td>Move</td></tr>
      <tr><td>Mouse</td><td>Aim</td></tr>
      <tr><td>Left click</td><td>Shoot (hold for automatic weapons)</td></tr>
      <tr><td><kbd>R</kbd></td><td>Reload</td></tr>
      <tr><td><kbd>E</kbd></td><td>Pick up loot (ammo is picked up automatically)</td></tr>
      <tr><td><kbd>1</kbd> <kbd>2</kbd> / <kbd>Q</kbd> / wheel</td><td>Switch weapon</td></tr>
    </table>
    <button id="startBtn">PLAY</button>
  </div>
</div>

<div id="endScreen" class="overlay hidden">
  <div class="panel">
    <h1 id="endTitle">ELIMINATED</h1>
    <p class="sub" id="endSub"></p>
    <div class="stats">
      <div class="stat"><b id="stPlace">#-</b><span>Placement</span></div>
      <div class="stat"><b id="stKills">0</b><span>Kills</span></div>
      <div class="stat"><b id="stDmg">0</b><span>Damage</span></div>
      <div class="stat"><b id="stTime">0:00</b><span>Survived</span></div>
    </div>
    <button id="restartBtn">PLAY AGAIN</button>
  </div>
</div>

<script>
'use strict';
// ---------- setup ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  VW = innerWidth; VH = innerHeight;
  cv.width = Math.floor(VW * DPR); cv.height = Math.floor(VH * DPR);
  cv.style.width = VW + 'px'; cv.style.height = VH + 'px';
}
addEventListener('resize', resize); resize();

const MAP = 3000, TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));
const fmtTime = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

const WEAPONS = {
  pistol:  { name: 'Pistol',        ammo: 'light',  dmg: 20, rate: 0.26, mag: 12, reload: 1.1, speed: 1150, spread: 0.035, pellets: 1, range: 750,  auto: false, tier: 1, color: '#cfd8dc', len: 14, w: 6 },
  smg:     { name: 'SMG',           ammo: 'light',  dmg: 11, rate: 0.075, mag: 30, reload: 1.6, speed: 1050, spread: 0.12, pellets: 1, range: 600,  auto: true,  tier: 2, color: '#4dd0e1', len: 19, w: 7 },
  shotgun: { name: 'Shotgun',       ammo: 'shells', dmg: 12, rate: 0.85, mag: 5,  reload: 2.0, speed: 950,  spread: 0.30, pellets: 8, range: 400,  auto: false, tier: 3, color: '#ffab40', len: 22, w: 8 },
  rifle:   { name: 'Assault Rifle', ammo: 'medium', dmg: 16, rate: 0.11, mag: 30, reload: 1.9, speed: 1450, spread: 0.055, pellets: 1, range: 950, auto: true,  tier: 3, color: '#9ccc65', len: 26, w: 7 },
  sniper:  { name: 'Sniper',        ammo: 'heavy',  dmg: 85, rate: 1.3,  mag: 5,  reload: 2.6, speed: 2600, spread: 0.004, pellets: 1, range: 1600, auto: false, tier: 4, color: '#ce93d8', len: 34, w: 6 },
};
const AMMO_COLORS = { light: '#ffe082', shells: '#ff8a65', medium: '#aed581', heavy: '#b39ddb' };
const AMMO_NAMES = { light: 'Light', shells: 'Shells', medium: 'Medium', heavy: 'Heavy' };
const AMMO_AMOUNT = { light: 30, shells: 10, medium: 30, heavy: 6 };
const PHASES = [
  { wait: 45, shrink: 30, r: 1050, dps: 1 },
  { wait: 30, shrink: 22, r: 650,  dps: 2 },
  { wait: 25, shrink: 18, r: 380,  dps: 4 },
  { wait: 20, shrink: 15, r: 200,  dps: 6 },
  { wait: 15, shrink: 12, r: 80,   dps: 9 },
  { wait: 10, shrink: 10, r: 0,    dps: 14 },
];
const NAMES = ['Viper','Ghost','Blaze','Nova','Raven','Titan','Echo','Frost','Jinx','Rogue','Bolt','Onyx','Kai','Luna','Sable','Drift','Hex','Zed','Pixel','Fang','Mako','Rex','Ash','Ivy','Storm','Lynx'];
const BOT_COLORS = ['#e57373','#f06292','#ba68c8','#9575cd','#7986cb','#4dd0e1','#4db6ac','#81c784','#dce775','#ffd54f','#ffb74d','#ff8a65','#a1887f','#90a4ae'];
const NUM_BOTS = 19, PLAYER_SPEED = 245, BOT_SPEED = 205, SIGHT = 520, PICK_RANGE = 60;

// ---------- state ----------
let state = 'start';
let obstacles = [], houses = [], decor = [], loot = [], entities = [], bullets = [], particles = [], floaters = [], killfeed = [];
let player = null, zone = null, cam = { x: 0, y: 0 }, camTarget = null, gameTime = 0, endTimer = -1, shake = 0;
let minimapBase = null, message = { text: '', t: 0 };
const keys = {}; const mouse = { x: 0, y: 0, down: false, clicked: false };

// ---------- audio ----------
let actx = null, noiseBuf = null, sfxBudget = 0;
function initAudio() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.3, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    }
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function sfx(kind, x, y, extra) {
  if (!actx || !player || sfxBudget <= 0) return;
  const d = dist(x, y, player.x, player.y); if (d > 1200) return;
  sfxBudget--;
  const vol = Math.pow(1 - d / 1200, 1.5) * 0.22, t = actx.currentTime;
  const g = actx.createGain(); g.connect(actx.destination);
  if (kind === 'shot') {
    const s = actx.createBufferSource(); s.buffer = noiseBuf;
    const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = extra || 1800;
    s.connect(f); f.connect(g);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    s.start(t); s.stop(t + 0.2);
  } else {
    const o = actx.createOscillator(); o.type = kind === 'hit' ? 'square' : 'sine';
    o.frequency.setValueAtTime(kind === 'hit' ? 520 : kind === 'pickup' ? 660 : 180, t);
    o.frequency.exponentialRampToValueAtTime(kind === 'pickup' ? 990 : 90, t + 0.12);
    o.connect(g); g.gain.setValueAtTime(vol * 0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
    o.start(t); o.stop(t + 0.15);
  }
}

// ---------- geometry ----------
function segCircle(x1, y1, x2, y2, cx, cy, r) {
  const dx = x2 - x1, dy = y2 - y1, fx = x1 - cx, fy = y1 - cy;
  const c = fx * fx + fy * fy - r * r; if (c <= 0) return 0;
  const a = dx * dx + dy * dy; if (a === 0) return -1;
  const b = 2 * (fx * dx + fy * dy), disc = b * b - 4 * a * c; if (disc < 0) return -1;
  const t = (-b - Math.sqrt(disc)) / (2 * a);
  return t >= 0 && t <= 1 ? t : -1;
}
function segRect(x1, y1, x2, y2, rx, ry, rw, rh) {
  let tmin = 0, tmax = 1; const dx = x2 - x1, dy = y2 - y1;
  if (Math.abs(dx) < 1e-9) { if (x1 < rx || x1 > rx + rw) return -1; }
  else { let t1 = (rx - x1) / dx, t2 = (rx + rw - x1) / dx; if (t1 > t2) { const s = t1; t1 = t2; t2 = s; } tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2); if (tmin > tmax) return -1; }
  if (Math.abs(dy) < 1e-9) { if (y1 < ry || y1 > ry + rh) return -1; }
  else { let t1 = (ry - y1) / dy, t2 = (ry + rh - y1) / dy; if (t1 > t2) { const s = t1; t1 = t2; t2 = s; } tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2); if (tmin > tmax) return -1; }
  return tmin;
}
function segObstacle(x1, y1, x2, y2) {
  const minx = Math.min(x1, x2), maxx = Math.max(x1, x2), miny = Math.min(y1, y2), maxy = Math.max(y1, y2);
  let best = -1;
  for (const o of obstacles) {
    let t;
    if (o.t === 'wall') {
      if (o.x > maxx || o.x + o.w < minx || o.y > maxy || o.y + o.h < miny) continue;
      t = segRect(x1, y1, x2, y2, o.x, o.y, o.w, o.h);
    } else {
      if (o.x - o.r > maxx || o.x + o.r < minx || o.y - o.r > maxy || o.y + o.r < miny) continue;
      t = segCircle(x1, y1, x2, y2, o.x, o.y, o.r);
    }
    if (t >= 0 && (best < 0 || t < best)) best = t;
  }
  return best;
}
const los = (ax, ay, bx, by) => segObstacle(ax, ay, bx, by) < 0;
function circleFree(x, y, r) {
  if (x < r || y < r || x > MAP - r || y > MAP - r) return false;
  for (const o of obstacles) {
    if (o.t === 'wall') {
      const cx = clamp(x, o.x, o.x + o.w), cy = clamp(y, o.y, o.y + o.h);
      if (dist2(x, y, cx, cy) < r * r) return false;
    } else if (dist2(x, y, o.x, o.y) < (r + o.r) * (r + o.r)) return false;
  }
  return true;
}
function inHouse(x, y, pad) { for (const h of houses) if (x > h.x - pad && x < h.x + h.w + pad && y > h.y - pad && y < h.y + h.h + pad) return h; return null; }
function resolveCollision(e) {
  for (const o of obstacles) {
    if (o.t === 'wall') {
      if (e.x + e.r < o.x || e.x - e.r > o.x + o.w || e.y + e.r < o.y || e.y - e.r > o.y + o.h) continue;
      const cx = clamp(e.x, o.x, o.x + o.w), cy = clamp(e.y, o.y, o.y + o.h);
      const dx = e.x - cx, dy = e.y - cy, d2 = dx * dx + dy * dy;
      if (d2 >= e.r * e.r) continue;
      if (d2 > 1e-6) { const d = Math.sqrt(d2); e.x = cx + dx / d * e.r; e.y = cy + dy / d * e.r; }
      else {
        const l = e.x - o.x, r = o.x + o.w - e.x, t = e.y - o.y, b = o.y + o.h - e.y, m = Math.min(l, r, t, b);
        if (m === l) e.x = o.x - e.r; else if (m === r) e.x = o.x + o.w + e.r; else if (m === t) e.y = o.y - e.r; else e.y = o.y + o.h + e.r;
      }
    } else {
      const rr = o.r + e.r, dx = e.x - o.x, dy = e.y - o.y;
      if (Math.abs(dx) > rr || Math.abs(dy) > rr) continue;
      const d2 = dx * dx + dy * dy;
      if (d2 < rr * rr) { const d = Math.sqrt(d2) || 0.01; e.x = o.x + dx / d * rr; e.y = o.y + dy / d * rr; }
    }
  }
  e.x = clamp(e.x, e.r, MAP - e.r); e.y = clamp(e.y, e.r, MAP - e.r);
}

// ---------- world generation ----------
function genMap() {
  obstacles = []; houses = []; decor = [];
  const T = 16, DOOR = 74;
  const addWall = (x, y, w, h) => { if (w > 1 && h > 1) obstacles.push({ t: 'wall', x, y, w, h }); };
  const hwall = (x1, x2, y, door) => { if (door) { const m = (x1 + x2) / 2; addWall(x1, y, m - DOOR / 2 - x1, T); addWall(m + DOOR / 2, y, x2 - m - DOOR / 2, T); } else addWall(x1, y, x2 - x1, T); };
  const vwall = (y1, y2, x, door) => { if (door) { const m = (y1 + y2) / 2; addWall(x, y1, T, m - DOOR / 2 - y1); addWall(x, m + DOOR / 2, T, y2 - m - DOOR / 2); } else addWall(x, y1, T, y2 - y1); };
  for (let i = 0; i < 10; i++) {
    for (let tries = 0; tries < 80; tries++) {
      const w = randi(220, 340), h = randi(200, 300), x = rand(150, MAP - 150 - w), y = rand(150, MAP - 150 - h);
      if (houses.some(o => x < o.x + o.w + 160 && x + w + 160 > o.x && y < o.y + o.h + 160 && y + h + 160 > o.y)) continue;
      const sides = [0, 1, 2, 3].sort(() => Math.random() - 0.5), doors = [false, false, false, false];
      doors[sides[0]] = true; doors[sides[1]] = true;
      hwall(x, x + w, y, doors[0]); hwall(x, x + w, y + h - T, doors[1]);
      vwall(y + T, y + h - T, x, doors[2]); vwall(y + T, y + h - T, x + w - T, doors[3]);
      houses.push({ x, y, w, h });
      break;
    }
  }
  const place = (n, rmin, rmax, t) => {
    for (let i = 0; i < n; i++) for (let tries = 0; tries < 40; tries++) {
      const r = rand(rmin, rmax), x = rand(60, MAP - 60), y = rand(60, MAP - 60);
      if (inHouse(x, y, r + 50) || !circleFree(x, y, r + 45)) continue;
      const o = { t, x, y, r };
      if (t === 'tree') { o.vr = r * 1.55; o.shade = rand(-12, 12); }
      else o.shade = rand(-15, 15);
      obstacles.push(o); break;
    }
  };
  place(45, 24, 48, 'rock');
  place(140, 20, 28, 'tree');
  for (let i = 0; i < 500; i++) decor.push({ x: rand(0, MAP), y: rand(0, MAP), s: rand(2, 4), c: pick(['rgba(255,255,255,.35)', 'rgba(255,235,59,.45)', 'rgba(0,0,0,.10)', 'rgba(0,0,0,.08)', 'rgba(255,138,128,.4)']) });
  // pre-render minimap base
  const S = 180; minimapBase = document.createElement('canvas'); minimapBase.width = S; minimapBase.height = S;
  const m = minimapBase.getContext('2d'), k = S / MAP;
  m.fillStyle = '#4c7a3e'; m.fillRect(0, 0, S, S);
  for (const h of houses) { m.fillStyle = '#a1887f'; m.fillRect(h.x * k, h.y * k, h.w * k, h.h * k); }
  for (const o of obstacles) {
    if (o.t === 'wall') { m.fillStyle = '#4e342e'; m.fillRect(o.x * k, o.y * k, Math.max(1, o.w * k), Math.max(1, o.h * k)); }
    else { m.fillStyle = o.t === 'tree' ? '#2e5d27' : '#8d8d8d'; m.beginPath(); m.arc(o.x * k, o.y * k, Math.max(1.2, o.r * k * (o.t === 'tree' ? 1.4 : 1)), 0, TAU); m.fill(); }
  }
}
function randomLoot(x, y) {
  const r = Math.random();
  if (r < 0.30) {
    const wr = Math.random(), type = wr < 0.28 ? 'pistol' : wr < 0.52 ? 'smg' : wr < 0.74 ? 'shotgun' : wr < 0.93 ? 'rifle' : 'sniper';
    loot.push({ kind: 'weapon', type, mag: WEAPONS[type].mag, x, y });
    const a = rand(0, TAU); loot.push({ kind: 'ammo', type: WEAPONS[type].ammo, amount: AMMO_AMOUNT[WEAPONS[type].ammo], x: x + Math.cos(a) * 30, y: y + Math.sin(a) * 30 });
  } else if (r < 0.62) { const type = pick(['light', 'light', 'shells', 'medium', 'medium', 'heavy']); loot.push({ kind: 'ammo', type, amount: AMMO_AMOUNT[type], x, y }); }
  else if (r < 0.84) loot.push({ kind: 'health', amount: 40, x, y });
  else loot.push({ kind: 'armor', amount: 50, x, y });
}
function genLoot() {
  loot = [];
  for (const h of houses) {
    const n = randi(3, 5);
    for (let i = 0; i < n; i++) for (let tries = 0; tries < 20; tries++) {
      const x = rand(h.x + 40, h.x + h.w - 40), y = rand(h.y + 40, h.y + h.h - 40);
      if (circleFree(x, y, 22)) { randomLoot(x, y); break; }
    }
  }
  for (let i = 0; i < 130; i++) for (let tries = 0; tries < 20; tries++) {
    const x = rand(80, MAP - 80), y = rand(80, MAP - 80);
    if (circleFree(x, y, 26)) { randomLoot(x, y); break; }
  }
}
function makeEntity(isPlayer, name, color, x, y) {
  return {
    isPlayer, name, color, x, y, vx: 0, vy: 0, r: 18, angle: rand(0, TAU), hp: 100, armor: 0,
    weapons: [{ type: 'pistol', mag: 12 }, null], slot: 0, ammo: { light: 24, shells: 0, medium: 0, heavy: 0 },
    cool: 0, reloading: 0, reloadTotal: 1, alive: true, kills: 0, damage: 0, hitFlash: 0, place: 0, diedAt: 0,
    ai: isPlayer ? null : { target: null, retarget: 0, react: 0, aimNoise: 0, strafe: 1, strafeT: 0, loot: null, lootT: 0,
      wx: x, wy: y, wanderT: 0, avoidT: 0, ax: 0, ay: 0, stuckT: 0.5, lx: x, ly: y, attacker: null, skill: rand(0.45, 0.95) }
  };
}
function spawnPoint(minD) {
  for (let tries = 0; tries < 300; tries++) {
    const x = rand(120, MAP - 120), y = rand(120, MAP - 120);
    if (inHouse(x, y, 30) || !circleFree(x, y, 30)) continue;
    if (entities.some(e => dist2(e.x, e.y, x, y) < minD * minD)) continue;
    return { x, y };
  }
  for (;;) { const x = rand(120, MAP - 120), y = rand(120, MAP - 120); if (circleFree(x, y, 30)) return { x, y }; }
}
function newGame() {
  genMap(); genLoot();
  entities = []; bullets = []; particles = []; floaters = []; killfeed = [];
  let p = spawnPoint(0); player = makeEntity(true, 'You', '#42a5f5', p.x, p.y); entities.push(player);
  const names = NAMES.slice().sort(() => Math.random() - 0.5);
  for (let i = 0; i < NUM_BOTS; i++) { p = spawnPoint(420); entities.push(makeEntity(false, names[i % names.length], BOT_COLORS[i % BOT_COLORS.length], p.x, p.y)); }
  zone = { x: MAP / 2, y: MAP / 2, r: 2150, phase: 0, state: 'wait', timer: 0, tx: 0, ty: 0, tr: 0, sx: 0, sy: 0, sr: 0 };
  setupPhase();
  cam.x = player.x - VW / 2; cam.y = player.y - VH / 2; camTarget = player;
  gameTime = 0; endTimer = -1; shake = 0; message = { text: 'Find weapons and survive the zone!', t: 3.5 };
  state = 'playing';
}
function setupPhase() {
  const P = PHASES[zone.phase];
  zone.state = 'wait'; zone.timer = P.wait;
  const maxOff = Math.max(0, zone.r - P.r) * (zone.phase === 0 ? 0.35 : 0.8), a = rand(0, TAU), d = Math.sqrt(Math.random()) * maxOff;
  const m = Math.min(P.r + 60, MAP / 2);
  zone.tx = clamp(zone.x + Math.cos(a) * d, m, MAP - m); zone.ty = clamp(zone.y + Math.sin(a) * d, m, MAP - m); zone.tr = P.r;
}
function updateZone(dt) {
  if (zone.state === 'final') return;
  zone.timer -= dt;
  const P = PHASES[zone.phase];
  if (zone.state === 'wait') {
