# Quality gate for pull requests (lint, format, test, build, e2e).
name: CI

on:
  pull_request:
    branches: ['main']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chrome for e2e
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Lint, format, test, build, and e2e
        run: pnpm lint && pnpm format:check && pnpm test && pnpm build && pnpm e2e
        env:
          VITE_USE_OBSTACLE_IMAGES: true
          VITE_DEBUG_OBSTACLE_COLLISION: false
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          SCREENSHOT: /tmp/zone-royale-e2e.png
